{% extends "base.html" %}

{% block title %}Edit Customer - GST App{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2>Edit Customer</h2>
        <form method="POST" class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label for="name" class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ customer.email or '' }}">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ customer.phone or '' }}">
                </div>

                <div class="mb-3">
                    <label for="gstin" class="form-label">GSTIN</label>
                    <input type="text" class="form-control" id="gstin" name="gstin" maxlength="15" value="{{ customer.gstin or '' }}">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3">{{ customer.address or '' }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city" value="{{ customer.city or '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" name="state" value="{{ customer.state or '' }}">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" class="form-control" id="pincode" name="pincode" maxlength="6" value="{{ customer.pincode or '' }}">
                </div>

                <div class="mb-3">
                    <label for="customer_type" class="form-label">Customer Type</label>
                    <select class="form-select" id="customer_type" name="customer_type">
                        <option value="Individual" {% if customer.customer_type == 'Individual' %}selected{% endif %}>Individual</option>
                        <option value="Business" {% if customer.customer_type == 'Business' %}selected{% endif %}>Business</option>
                        <option value="Government" {% if customer.customer_type == 'Government' %}selected{% endif %}>Government</option>
                        <option value="Other" {% if customer.customer_type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Update Customer</button>
                <a href="{{ url_for('customer.list_customers') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
