{% extends "base.html" %}

{% block title %}Edit Invoice - GST App{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>Edit Invoice</h2>
        <form method="POST">
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Invoice: {{ invoice.invoice_number }}</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="4">{{ invoice.notes or '' }}</textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('invoice.view_invoice', invoice_id=invoice.id) }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
